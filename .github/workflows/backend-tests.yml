name: backend-tests

on:
  push:
    paths:
      - 'advent-backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'advent-backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advent-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the project's Django 5.2 support window (not local 3.14).
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check --settings=music.settings_test

      - name: Run test suite
        run: python manage.py test songs --settings=music.settings_test -v2
