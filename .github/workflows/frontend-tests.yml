name: frontend-tests

on:
  push:
    paths:
      - 'front/streams/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'front/streams/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: front/streams
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/streams/package-lock.json

      # Skip native postinstall scripts (e.g. @sentry/cli) — not needed for the
      # jest unit tests, and they slow down / can fail CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Gate on lint errors (undefined refs, dup keys, bad hooks, unresolved
      # imports). Stylistic rules are warnings and don't fail the build.
      - name: Lint
        run: npx eslint .

      - name: Run unit tests
        run: npm test
