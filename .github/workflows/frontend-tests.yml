name: frontend-tests

on:
  push:
    paths:
      - 'front/streams/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'front/streams/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/streams
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/streams/package-lock.json

      # Skip native postinstall scripts (e.g. @sentry/cli) — not needed for the
      # jest unit tests, and they slow down / can fail CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test
